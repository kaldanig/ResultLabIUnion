name: Publish to NuGet

# Publishes ResultUnion, ResultUnion.AspNetCore and ResultUnion.Grpc to nuget.org when a version tag is pushed
# (v0.1.0, v0.2.0-preview.1, ...). It uses NuGet trusted publishing: NuGet/login exchanges the job's OIDC token for a
# short-lived API key, so the repository stores no API key. Requires a trusted publishing policy on nuget.org for this
# workflow file, and the NUGET_USER secret (the nuget.org profile name) in the "release" environment.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release            # holds NUGET_USER; add required reviewers there for an approval gate
    permissions:
      id-token: write               # required for NuGet/login (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # full history for Source Link

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Read and check the version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREFIX="${VERSION%%-*}"
          PROPS_PREFIX=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          if [ "$PREFIX" != "$PROPS_PREFIX" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VersionPrefix $PROPS_PREFIX in Directory.Build.props"
            exit 1
          fi
          # The section of exactly this version: "## [1.0.0-rc.1]" for a release candidate, "## [1.0.0]" for the release.
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' entry"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ResultLabIUnion.slnx

      - name: Build
        run: dotnet build ResultLabIUnion.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --solution ResultLabIUnion.slnx --configuration Release --no-build

      - name: Pack
        shell: bash
        run: |
          for project in ResultUnion ResultUnion.AspNetCore ResultUnion.Grpc ResultUnion.FluentValidation ResultUnion.Http ResultUnion.Testing; do
            dotnet pack "$project/$project.csproj" --configuration Release --no-build \
              --output artifacts -p:Version=${{ steps.version.outputs.version }}
          done
          # Not in the solution, so packed with its own restore and build.
          dotnet pack ResultUnion.Templates/ResultUnion.Templates.csproj --configuration Release \
            --output artifacts -p:Version=${{ steps.version.outputs.version }}

      # The template must create projects that build and pass their tests with the packages about to be published.
      - name: Test the template
        run: bash ResultUnion.Templates/test-template.sh artifacts

      - name: NuGet login (OIDC)
        id: login
        # Pinned to a commit: this step can publish to nuget.org, so a moved tag must not change the code it runs.
        # Dependabot updates the commit and the version comment together.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, not the email

      - name: Push to nuget.org
        # The .snupkg symbol packages next to each .nupkg are pushed with it.
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
