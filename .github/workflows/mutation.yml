name: Mutation testing

# Stryker.NET changes the library's code in small ways (a removed argument check, a flipped condition, …) and runs the
# tests against each change; a change no test notices points at a missing assertion. Informational only: it runs once a
# week and on demand, never blocks a pull request, and uploads the HTML reports (docs/RELEASING.md, "Mutation testing").

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  stryker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ResultUnion, ResultUnion.AspNetCore, ResultUnion.Grpc]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Run Stryker
        working-directory: ${{ matrix.package }}.Tests
        run: |
          dotnet tool restore
          dotnet stryker --config-file ../stryker-config.json --project ${{ matrix.package }}.csproj \
            --output ../artifacts/stryker/${{ matrix.package }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-${{ matrix.package }}
          path: artifacts/stryker/${{ matrix.package }}/reports
          if-no-files-found: ignore
