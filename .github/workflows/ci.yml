name: CI

# Builds, tests and packs on every push to master and every pull request. The tests run twice, with Runtime Async (with
# code coverage) and with the classic state machines. The packages (version 0.x.y-ci.<run>) and the coverage report are
# uploaded as run artifacts; nothing is published. Publishing is publish.yml, on a version tag.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history for Source Link

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Choose the package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=-p:VersionSuffix=ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore ResultLabIUnion.slnx

      - name: Build
        run: dotnet build ResultLabIUnion.slnx --configuration Release --no-restore ${{ steps.version.outputs.args }}

      # Tests with code coverage of the shipped assemblies (codecoverage.settings.xml); the merged report is in the run
      # summary and, as HTML, in the "coverage" artifact.
      - name: Test
        run: >
          dotnet test --solution ResultLabIUnion.slnx --configuration Release --no-build
          --coverage --coverage-settings codecoverage.settings.xml --coverage-output-format cobertura
          --results-directory artifacts/coverage

      - name: Coverage report
        if: always()
        shell: bash
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:'artifacts/coverage/*.cobertura.xml' -targetdir:artifacts/coverage/report \
            -reporttypes:'Html;MarkdownSummaryGithub' -verbosity:Warning
          cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: artifacts/coverage/report
          if-no-files-found: ignore

      # The same tests against the classic async state machines (-p:EnableRuntimeAsync=false builds into
      # artifacts/state-machines/), since the library must behave the same both ways.
      - name: Test with classic async state machines
        run: dotnet test --solution ResultLabIUnion.slnx --configuration Release -p:EnableRuntimeAsync=false

      - name: Pack
        shell: bash
        run: |
          for project in ResultUnion ResultUnion.AspNetCore ResultUnion.Grpc ResultUnion.FluentValidation ResultUnion.Http; do
            dotnet pack "$project/$project.csproj" --configuration Release --no-build \
              --output artifacts ${{ steps.version.outputs.args }}
          done

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
