# SonarQube Cloud automatic analysis (https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/).

# The skill's eval fixtures are sample inputs for testing the skill, some of them wrong on purpose; not product code.
sonar.exclusions=.claude/**

# Every dotnet new template is self-contained, so resultunion-grpc repeats resultunion-api's products feature (value
# objects, repository, DbContext). That copy is the design, not duplication to remove; test-template.sh checks both.
sonar.cpd.exclusions=ResultUnion.Templates/content/**
