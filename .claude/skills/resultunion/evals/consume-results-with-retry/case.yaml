schema_version: "1.1"
name: consume-results-with-retry
expected_outcome: |
  ChargeAsync returns Task<Result<string>> with catalog errors: declined as a non-transient type, 429 as TooManyRequests with a retryAfterSeconds argument, 503 and timeouts as Unavailable; the retrier uses IsTransient and the argument; values are read with switch, Match or TryGetResultValue. The project builds.
